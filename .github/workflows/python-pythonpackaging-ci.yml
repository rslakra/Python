name: Python - PythonPackaging CI

on:
  push:
    paths:
      - "PythonPackaging/**"
      - ".github/workflows/python-pythonpackaging-ci.yml"
  pull_request:
    paths:
      - "PythonPackaging/**"
      - ".github/workflows/python-pythonpackaging-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: PythonPackaging

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # requirements.txt is empty: the package has no runtime dependencies.
      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -t . -v

      # Builds the sdist and wheel from pyproject.toml (it never uploads them).
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build
