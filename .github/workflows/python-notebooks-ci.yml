name: Python - Notebooks CI

on:
  push:
    paths:
      - "Notebooks/**"
      - ".github/workflows/python-notebooks-ci.yml"
  pull_request:
    paths:
      - "Notebooks/**"
      - ".github/workflows/python-notebooks-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: Notebooks

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install nbformat
        run: |
          python -m pip install --upgrade pip
          pip install nbformat

      # There is no code to test: this checks that every notebook is valid nbformat JSON.
      - name: Validate notebooks
        run: |
          python - <<'PY'
          import glob
          import sys

          import nbformat

          failed = False
          for path in sorted(glob.glob("*.ipynb")):
              try:
                  nbformat.validate(nbformat.read(path, as_version=4))
                  print(f"OK    {path}")
              except Exception as error:
                  print(f"ERROR {path}: {error}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY
