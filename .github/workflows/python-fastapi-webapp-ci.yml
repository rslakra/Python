name: Python - FastAPI WebApp (Jinja) CI

on:
  push:
    paths:
      - "fastapi-webapp/**"
      - ".github/workflows/python-fastapi-webapp-ci.yml"
  pull_request:
    paths:
      - "fastapi-webapp/**"
      - ".github/workflows/python-fastapi-webapp-ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: fastapi-webapp

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: fastapi-webapp/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The project has no unit tests, so this checks that the code compiles and that the server
      # starts and serves its pages, API and static files.
      - name: Check the code
        run: python -m compileall -q app

      - name: Smoke test the server
        run: |
          python -m uvicorn app.main:app --port 8000 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for _ in $(seq 1 20); do
            curl -fsS http://localhost:8000/api/health > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://localhost:8000/api/health
          echo
          for path in / /about /features /dashboard /static/css/style.css /static/js/main.js; do
            curl -fsS -o /dev/null -w "$path %{http_code}\n" "http://localhost:8000$path"
          done
